name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'jeyamohanarticles/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jeyamohanarticles/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: jeyamohanarticles
      - name: Lint
        run: npm run lint
        working-directory: jeyamohanarticles
      - name: Build for GitHub Pages
        run: npm run build -- --base=/onetwo/
        working-directory: jeyamohanarticles
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: jeyamohanarticles/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
